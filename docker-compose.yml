version: '0.1'

services:
  auth-app:
    image: auth:latest
    env_file:
      - .env
    ports:
      - "8098:8098"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:  {}